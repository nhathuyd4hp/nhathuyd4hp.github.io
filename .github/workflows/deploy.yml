name: Deploy Static Content to Pages

on:
  push:
    branches: ["main"]  # Hoặc "master" nếu nhánh chính của bạn tên là master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build CV PDF
        run: |
          google-chrome --headless --no-sandbox --disable-gpu --no-pdf-header-footer \
            --virtual-time-budget=10000 --print-to-pdf=cv.pdf "file://$PWD/index.html"
          grep -aqE "/Count 1([^0-9]|$)" cv.pdf || { echo "::error::cv.pdf is longer than one page"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload toàn bộ repository
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4